<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Property Manager Portal - Login</title>
    <link href="../../assets/css/output.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
    </style>
</head>
<body class="font-display">
    <div
        class="relative flex min-h-screen w-full flex-col items-center justify-center bg-background-light dark:bg-background-dark p-4 md:p-6 lg:p-8">
        <!-- Background Image with Overlay -->
        <div class="absolute inset-0 z-0">
            <div class="w-full h-full bg-center bg-no-repeat bg-cover"
                data-alt="A modern residential building with large windows and a clean facade."
                style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDETaMbwug_jfOlChrvsF6Dr0qmlwYuGRLdE9leTbJEVKX31M9qEj5IoIBR9XyvalAq99GtYCYotaIfdR_Vq6IAsD9O7lEVIXx5CqPg1M3vJiSJlTyhwhY9EI4yDN7hJzkRvlAerUakr4eVWfrDbtJmR69F63giI-T-a7qJxdGvyKI3ZpyvfHGgV6vaXLjWFRGkLa5HZU02vqajMDIroS83XZT7_ytSX4ZuW-r4bLLK3eFLcu0SJ8_NpmY-PmqydQYMCwWthcpxZyg");'>
            </div>
            <div class="absolute inset-0 bg-gray-900/60 dark:bg-gray-900/70"></div>
        </div>
        <main class="relative z-10 flex w-full max-w-md flex-col items-center">
            <!-- Login Card -->
            <div class="w-full rounded-xl bg-background-light dark:bg-background-dark shadow-2xl p-8 md:p-10 space-y-6">
                <!-- Logo and Heading -->
                <div class="text-center">
                    <img alt="Company Logo" class="mx-auto h-12 w-auto"
                        data-alt="Abstract geometric logo in shades of blue and green"
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuD_PL72_Db8nLPyVF-T8Vwk0aaYmr9hChBgH45w7rZL2DEKICTyKU1I5FMf24R4FwlO9aR9Q0rwcjvEjy1-5My9XkeF1jRbqtjBqytN1rTh3La3M7_NoxdeJB_JJ4HE18EZ0uuYl_I0d50JJb4J1bExiblu6gi-wztSkwTLsJ4eB7ijmiWxNsEcb5Do9XRaQto1oofK_3rObiF02IGNIKnrM2-MSsPZibVkFztCZH963lg_Vw7JA0aeXwuqe67mFbNwyyvg7kes87o" />
                    <h1
                        class="mt-6 text-2xl md:text-3xl font-black text-text-primary dark:text-white leading-tight tracking-tight">
                        Property Manager Portal</h1>
                    <p class="mt-2 text-sm text-text-secondary dark:text-gray-400">Sign in to your account</p>
                </div>
                <!-- Form -->
                <form id="loginForm" class="space-y-6" method="GET" action="../../pages/dashboard/index.html">
                    <!-- Email Input -->
                    <div>
                        <label class="block text-sm font-medium text-text-primary dark:text-gray-300 pb-2"
                            for="email">Email Address</label>
                        <div class="relative">
                            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                                <span
                                    class="material-symbols-outlined text-text-secondary dark:text-gray-400">mail</span>
                            </div>
                            <input autocomplete="email"
                                class="form-input block w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white py-3 pl-10 pr-3 text-text-primary placeholder:text-text-secondary/70 focus:border-primary focus:ring-primary text-base"
                                id="email" name="email" placeholder="Enter your email" required="" type="email" />
                        </div>
                    </div>
                    <!-- Password Input -->
                    <div>
                        <label class="block text-sm font-medium text-text-primary dark:text-gray-300 pb-2"
                            for="password">Password</label>
                        <div class="relative">
                            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                                <span
                                    class="material-symbols-outlined text-text-secondary dark:text-gray-400">lock</span>
                            </div>
                            <input autocomplete="current-password"
                                class="form-input block w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white py-3 pl-10 pr-10 text-text-primary placeholder:text-text-secondary/70 focus:border-primary focus:ring-primary text-base"
                                id="password" name="password" placeholder="Enter your password" required=""
                                type="password" />
                            <button aria-label="Toggle password visibility"
                                class="absolute inset-y-0 right-0 flex items-center pr-3" type="button">
                                <span
                                    class="material-symbols-outlined text-text-secondary dark:text-gray-400 hover:text-text-primary dark:hover:text-white cursor-pointer">visibility_off</span>
                            </button>
                        </div>
                    </div>
                    <!-- Remember Me and Forgot Password -->
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input
                                class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 dark:bg-gray-700 text-primary focus:ring-primary"
                                id="remember-me" name="remember-me" type="checkbox" />
                            <label class="ml-2 block text-sm text-text-secondary dark:text-gray-400"
                                for="remember-me">Remember me</label>
                        </div>
                        <div class="text-sm">
                            <a class="font-medium text-primary hover:text-primary/80" href="#">Forgot Password?</a>
                        </div>
                    </div>
                    <!-- Login Button -->
                    <div>
                        <button
                            class="flex w-full justify-center rounded-lg bg-primary px-3 py-3 text-base font-semibold leading-6 text-white shadow-sm hover:bg-primary/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
                            type="submit">Login</button>
                    </div>
                </form>
                <!-- Admin Invitation Link -->
                <div class="text-center text-sm text-text-secondary dark:text-gray-400">
                    <p>
                        Invited to be a Property Manager?
                        <a class="font-medium text-primary hover:text-primary/80" href="register.html">
                            Accept your invitation here.
                        </a>
                    </p>
                </div>
                <!-- Footer Links -->
                <footer class="mt-8 text-center text-sm text-white/80">
                    <div class="flex justify-center space-x-4">
                        <a class="hover:underline" href="#">Terms of Service</a>
                        <span>·</span>
                        <a class="hover:underline" href="#">Privacy Policy</a>
                        <span>·</span>
                        <a class="hover:underline" href="#">Help Center</a>
                    </div>
                </footer>
            </div>
        </main>
    </div>

  
</body>
</html>

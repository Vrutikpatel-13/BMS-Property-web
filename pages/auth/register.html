<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Complete Your Registration</title>
    <link href="../../assets/css/output.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;900&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
    </style>
</head>

<body class="font-display bg-background-light dark:bg-background-dark">
    <div class="relative flex min-h-screen w-full flex-col items-center justify-center p-4 sm:p-6 lg:p-8">
        <div
            class="w-full max-w-2xl rounded-xl bg-white dark:bg-gray-800 shadow-lg border border-gray-200 dark:border-gray-700 p-6 sm:p-8 lg:p-10">
            <!-- PageHeading -->
            <div class="text-center mb-6">
                <p
                    class="text-text-primary dark:text-white text-3xl sm:text-4xl font-black leading-tight tracking-tight">
                    Complete Your Registration</p>
            </div>
            <!-- ProgressBar -->
            <div class="mb-8">
                <div class="flex items-center justify-between gap-2 sm:gap-4">
                    <div class="flex flex-col items-center gap-2 flex-1">
                        <div
                            class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white font-bold">
                            1</div>
                        <p class="text-primary text-xs sm:text-sm font-semibold text-center">Verify</p>
                    </div>
                    <div class="flex-1 h-0.5 bg-gray-200 dark:bg-gray-600"></div>
                    <div class="flex flex-col items-center gap-2 flex-1">
                        <div
                            class="w-8 h-8 rounded-full bg-gray-200 dark:bg-gray-600 flex items-center justify-center text-text-secondary dark:text-gray-400 font-bold">
                            2</div>
                        <p class="text-text-secondary dark:text-gray-400 text-xs sm:text-sm font-medium text-center">
                            Profile</p>
                    </div>
                    <div class="flex-1 h-0.5 bg-gray-200 dark:bg-gray-600"></div>
                    <div class="flex flex-col items-center gap-2 flex-1">
                        <div
                            class="w-8 h-8 rounded-full bg-gray-200 dark:bg-gray-600 flex items-center justify-center text-text-secondary dark:text-gray-400 font-bold">
                            3</div>
                        <p class="text-text-secondary dark:text-gray-400 text-xs sm:text-sm font-medium text-center">
                            Password</p>
                    </div>
                    <div class="flex-1 h-0.5 bg-gray-200 dark:bg-gray-600"></div>
                    <div class="flex flex-col items-center gap-2 flex-1">
                        <div
                            class="w-8 h-8 rounded-full bg-gray-200 dark:bg-gray-600 flex items-center justify-center text-text-secondary dark:text-gray-400 font-bold">
                            4</div>
                        <p class="text-text-secondary dark:text-gray-400 text-xs sm:text-sm font-medium text-center">
                            Contact</p>
                    </div>
                    <div class="flex-1 h-0.5 bg-gray-200 dark:bg-gray-600"></div>
                    <div class="flex flex-col items-center gap-2 flex-1">
                        <div
                            class="w-8 h-8 rounded-full bg-gray-200 dark:bg-gray-600 flex items-center justify-center text-text-secondary dark:text-gray-400 font-bold">
                            5</div>
                        <p class="text-text-secondary dark:text-gray-400 text-xs sm:text-sm font-medium text-center">
                            Review</p>
                    </div>
                </div>
            </div>
            <!-- Step 1: Verify Invitation -->
            <div id="step-1">
                <div class="mb-6 text-center">
                    <h2 class="text-xl font-bold text-text-primary dark:text-white">Step 1: Verify Invitation</h2>
                    <p class="text-text-secondary dark:text-gray-400 mt-1">Please confirm your details to begin.</p>
                </div>
                <div class="space-y-6">
                    <!-- Full Name TextField -->
                    <label class="flex flex-col w-full">
                        <p class="text-text-primary dark:text-gray-300 text-base font-medium leading-normal pb-2">Full
                            Name</p>
                        <input
                            class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-secondary dark:text-gray-400 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-600 bg-gray-100 dark:bg-gray-700 h-12 p-3 text-base font-normal leading-normal cursor-not-allowed"
                            readonly="" value="Johnathan Doe" />
                    </label>
                    <!-- Email Address TextField -->
                    <label class="flex flex-col w-full">
                        <p class="text-text-primary dark:text-gray-300 text-base font-medium leading-normal pb-2">Email
                            Address</p>
                        <input
                            class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-secondary dark:text-gray-400 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-600 bg-gray-100 dark:bg-gray-700 h-12 p-3 text-base font-normal leading-normal cursor-not-allowed"
                            readonly="" value="j.doe@example.com" />
                    </label>
                </div>
                <!-- Submit Button -->
                <div class="mt-8">
                    <a href="../dashboard/index.html">
                        <button
                            class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-gray-800 transition-colors">
                            <span class="truncate">Submit</span>
                        </button>
                    </a>
                </div>
            </div>
            <!-- Future steps would be hidden and shown dynamically -->
            <!-- For this static example, only Step 1 is visible -->
        </div>
    </div>
</body>

</html>

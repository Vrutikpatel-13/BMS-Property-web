<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Add Tenant - Building Management System</title>
    <link href="../../assets/css/output.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
    <div class="relative flex min-h-screen w-full">
        <!-- Standardized Sidebar - All Menu Items -->
        <aside class="flex w-64 flex-col bg-white dark:bg-gray-800 p-4 border-r border-gray-200 dark:border-gray-700">
            <!-- User Profile Section -->
            <div class="flex flex-col gap-4">
                <div class="flex gap-3 items-center">
                    <div class="flex items-center gap-4">
                        <span class="material-symbols-outlined text-primary text-3xl">domain</span>
                        <h2 class="text-lg font-bold tracking-[-0.015em]">BMS</h2>
                    </div>
                </div>

                <!-- Main Navigation -->
                <div class="flex flex-col gap-2 mt-4">
                    <!-- Dashboard -->
                    <a class="flex items-center gap-3 px-3 py-2 text-text-secondary dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg" 
                       href="../../pages/dashboard/index.html">
                        <span class="material-symbols-outlined text-text-primary dark:text-gray-200">dashboard</span>
                        <p class="text-text-primary dark:text-gray-200 text-sm font-medium leading-normal">Dashboard</p>
                    </a>
                    
                    <!-- Properties -->
                    <a class="flex items-center gap-3 px-3 py-2 text-text-secondary dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg" 
                       href="../../pages/properties/propertylist.html">
                        <span class="material-symbols-outlined text-text-primary dark:text-gray-200">apartment</span>
                        <p class="text-text-primary dark:text-gray-200 text-sm font-medium leading-normal">Properties</p>
                    </a>
                    
                    <!-- Tenants -->
                    <a class="flex items-center gap-3 px-3 py-2 rounded-lg bg-primary/10" 
                       href="../../pages/tenants/tenantdirectory.html">
                        <span class="material-symbols-outlined text-primary">groups</span>
                        <p class="text-primary text-sm font-medium leading-normal">Tenants</p>
                    </a>
                    
                    <!-- Payments -->
                    <a class="flex items-center gap-3 px-3 py-2 text-text-secondary dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg" 
                       href="../../pages/payments/payment.html">
                        <span class="material-symbols-outlined text-text-primary dark:text-gray-200">payments</span>
                        <p class="text-text-primary dark:text-gray-200 text-sm font-medium leading-normal">Payments</p>
                    </a>
                    
                    <!-- Settings -->
                    <a class="flex items-center gap-3 px-3 py-2 text-text-secondary dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg" 
                       href="../../pages/dashboard/profile&accountsetting.html">
                        <span class="material-symbols-outlined text-text-primary dark:text-gray-200">settings</span>
                        <p class="text-text-primary dark:text-gray-200 text-sm font-medium leading-normal">Settings</p>
                    </a>
                    
                    <!-- Notifications -->
                    <a class="flex items-center gap-3 px-3 py-2 text-text-secondary dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg" 
                       href="../../pages/tenants/notificationpreferences.html">
                        <span class="material-symbols-outlined text-text-primary dark:text-gray-200">notifications</span>
                        <p class="text-text-primary dark:text-gray-200 text-sm font-medium leading-normal">Notifications</p>
                    </a>
                </div>
            </div>
            
            <!-- Account Actions -->
            <div class="mt-auto flex flex-col gap-2">
                <!-- Delete My Account -->
                <a class="flex items-center gap-3 px-3 py-2 text-error hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg" 
                   href="#" onclick="confirmDeleteAccount()">
                    <span class="material-symbols-outlined text-error">delete_forever</span>
                    <p class="text-error text-sm font-medium leading-normal">Delete My Account</p>
                </a>
                
                <!-- Logout -->
                <a class="flex items-center gap-3 px-3 py-2 text-error hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg" 
                   href="../../pages/auth/login.html">
                    <span class="material-symbols-outlined text-error">logout</span>
                    <p class="text-error text-sm font-medium leading-normal">Logout</p>
                </a>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="flex-1 p-8 overflow-y-auto">
            <div class="max-w-4xl mx-auto">
                <!-- PageHeading -->
                <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
                    <h1 class="text-text-primary dark:text-white text-4xl font-black leading-tight tracking-[-0.033em]">Add New Tenant</h1>
                </div>
                
                <!-- Add Tenant Form -->
                <div class="bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 p-6">
                    <form class="space-y-6">
                        <!-- Personal Information -->
                        <div>
                            <h2 class="text-lg font-semibold text-text-primary dark:text-white mb-4">Personal Information</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-text-primary dark:text-white mb-2">First Name</label>
                                    <input type="text" class="w-full px-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-text-primary dark:text-white" placeholder="Enter first name">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-text-primary dark:text-white mb-2">Last Name</label>
                                    <input type="text" class="w-full px-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-text-primary dark:text-white" placeholder="Enter last name">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-text-primary dark:text-white mb-2">Email</label>
                                    <input type="email" class="w-full px-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-text-primary dark:text-white" placeholder="Enter email address">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-text-primary dark:text-white mb-2">Phone</label>
                                    <input type="tel" class="w-full px-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-text-primary dark:text-white" placeholder="Enter phone number">
                                </div>
                            </div>
                        </div>
                        
                        <!-- Property Assignment -->
                        <div>
                            <h2 class="text-lg font-semibold text-text-primary dark:text-white mb-4">Property Assignment</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-text-primary dark:text-white mb-2">Property</label>
                                    <select class="w-full px-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-text-primary dark:text-white">
                                        <option>Select Property</option>
                                        <option>The Birchwood</option>
                                        <option>Oakwood Towers</option>
                                        <option>Pine Ridge Apartments</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-text-primary dark:text-white mb-2">Unit</label>
                                    <select class="w-full px-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-text-primary dark:text-white">
                                        <option>Select Unit</option>
                                        <option>Unit 101</option>
                                        <option>Unit 102</option>
                                        <option>Unit 201</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Lease Information -->
                        <div>
                            <h2 class="text-lg font-semibold text-text-primary dark:text-white mb-4">Lease Information</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-text-primary dark:text-white mb-2">Lease Start Date</label>
                                    <input type="date" class="w-full px-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-text-primary dark:text-white">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-text-primary dark:text-white mb-2">Lease End Date</label>
                                    <input type="date" class="w-full px-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-text-primary dark:text-white">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-text-primary dark:text-white mb-2">Monthly Rent</label>
                                    <input type="number" class="w-full px-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-text-primary dark:text-white" placeholder="Enter monthly rent">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-text-primary dark:text-white mb-2">Security Deposit</label>
                                    <input type="number" class="w-full px-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-text-primary dark:text-white" placeholder="Enter security deposit">
                                </div>
                            </div>
                        </div>
                        
                        <!-- Emergency Contact -->
                        <div>
                            <h2 class="text-lg font-semibold text-text-primary dark:text-white mb-4">Emergency Contact</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-text-primary dark:text-white mb-2">Contact Name</label>
                                    <input type="text" class="w-full px-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-text-primary dark:text-white" placeholder="Enter emergency contact name">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-text-primary dark:text-white mb-2">Contact Phone</label>
                                    <input type="tel" class="w-full px-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-text-primary dark:text-white" placeholder="Enter emergency contact phone">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-text-primary dark:text-white mb-2">Relationship</label>
                                    <input type="text" class="w-full px-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-text-primary dark:text-white" placeholder="Enter relationship">
                                </div>
                            </div>
                        </div>
                        
                        <!-- Actions -->
                        <div class="flex gap-4">
                            <button type="submit" class="flex-1 px-6 py-3 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors font-medium">
                                Add Tenant
                            </button>
                            <button type="button" class="px-6 py-3 border border-gray-200 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors font-medium text-text-primary dark:text-white">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
